[project]
name = "boxing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deep-sort-realtime>=1.3.2",
    "gdown>=6.5.1",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "setuptools<81",
    "tensorboard>=2.21.0",
    "timm>=1.0.31",
    "torch>=2.13,<2.15",
    "torchreid @ git+https://github.com/KaiyangZhou/deep-person-reid.git@f8cd150fdf77e8d9e1ed143b7f308c2c609ded50",
    "torchvision>=0.28,<0.30",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
    "ultralytics>=8.4.215",
    "wandb>=0.31.0",
    "yacs>=0.1.8",
]

[project.scripts]
boxing = "boxing.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/boxing"]

[tool.uv.sources]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
]
