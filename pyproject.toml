[project]
name = "boxing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
    "wandb>=0.31.0",
]

[project.scripts]
boxing = "boxing.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxing"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
]
